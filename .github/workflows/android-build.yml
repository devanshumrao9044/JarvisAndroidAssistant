name: Build Jarvis Android Assistant APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Auto-Fix Kotlin Imports & Build Debug APK
        run: |
          if [ -d "JarvisAndroidAssistant" ] && [ -f "JarvisAndroidAssistant/settings.gradle.kts" ]; then
            cd JarvisAndroidAssistant
          fi

          # 1. Fix invalid top-level weight import and LocalLifecycleOwner import in AvatarView.kt
          if [ -f "app/src/main/java/com/jarvis/assistant/avatar/AvatarView.kt" ]; then
            sed -i '/import androidx\.compose\.foundation\.layout\.weight/d' app/src/main/java/com/jarvis/assistant/avatar/AvatarView.kt
            sed -i 's/import androidx\.lifecycle\.compose\.LocalLifecycleOwner/import androidx.compose.ui.platform.LocalLifecycleOwner/g' app/src/main/java/com/jarvis/assistant/avatar/AvatarView.kt
          fi

          # 2. Fix missing holdDurationMs parameter in AvatarVoiceSynchronizer.kt
          if [ -f "app/src/main/java/com/jarvis/assistant/avatar/AvatarVoiceSynchronizer.kt" ]; then
            sed -i 's/fun triggerContextualExpression(expression: AvatarExpression, gesture: AvatarGesture? = null)/fun triggerContextualExpression(expression: AvatarExpression, gesture: AvatarGesture? = null, holdDurationMs: Long = 4500L)/g' app/src/main/java/com/jarvis/assistant/avatar/AvatarVoiceSynchronizer.kt
          fi

          # 3. Ensure integer math in AvatarRenderer.kt
          if [ -f "app/src/main/java/com/jarvis/assistant/avatar/AvatarRenderer.kt" ]; then
            sed -i 's/minFrameIntervalNanos \* 0\.88L/minFrameIntervalNanos * 88L \/ 100L/g' app/src/main/java/com/jarvis/assistant/avatar/AvatarRenderer.kt
          fi

          # 4. Run Gradle build without --stacktrace so any compiler message is printed cleanly at the bottom
          set -o pipefail
          gradle assembleDebug --console=plain 2>&1 | tee build_output.log || {
            echo "===================================================="
            echo "EXACT COMPILER / GRADLE ERRORS (BOTTOM SUMMARY):"
            echo "===================================================="
            grep -E "(^e: |FAILURE:|What went wrong:|Execution failed for task|> |Unresolved reference|Type mismatch|Cannot find)" build_output.log | tail -n 50
            exit 1
          }

      - name: Upload Installable Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JarvisAndroidAssistant-debug-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
