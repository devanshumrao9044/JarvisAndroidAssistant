name: Build Jarvis Android Assistant APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          if [ -f "settings.gradle.kts" ]; then
            gradle assembleDebug --stacktrace
          elif [ -f "JarvisAndroidAssistant/settings.gradle.kts" ]; then
            cd JarvisAndroidAssistant && gradle assembleDebug --stacktrace
          else
            echo "Error: Could not find settings.gradle.kts in root or JarvisAndroidAssistant/"
            ls -la
            exit 1
          fi

      - name: Upload Installable Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JarvisAndroidAssistant-debug-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
